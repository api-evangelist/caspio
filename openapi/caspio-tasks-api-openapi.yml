openapi: 3.2.0
info:
  title: Caspio REST Tasks API
  description: 'The Caspio Bridge REST API (v3) provides programmatic access to tables, views,

    records, files, users, applications, and tasks in a Caspio account.'
  version: 3.0.0
  contact:
    name: Caspio
    url: https://www.caspio.com/
servers:
- url: https://{account}.caspio.com/rest/v3
  description: Per-account Caspio Bridge REST endpoint
  variables:
    account:
      default: demo
      description: Caspio account subdomain
security:
- bearerAuth: []
tags:
- name: Tasks
  description: Scheduled tasks
paths:
  /tasks:
    get:
      tags:
      - Tasks
      summary: List scheduled tasks
      operationId: listTasks
      responses:
        '200':
          description: Task list
  /tasks/{taskName}/run:
    post:
      tags:
      - Tasks
      summary: Run a scheduled task on demand
      operationId: runTask
      parameters:
      - in: path
        name: taskName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task run accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
