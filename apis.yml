  name: Caspio REST API
  description: >-
    REST API for Caspio Bridge accounts providing programmatic access to tables, views, records, files,
    users, applications, and tasks. Uses OAuth 2.0 client credentials flow to obtain Bearer access tokens
    scoped to a per-account integration URL.
